name: Fleet Spike

on:
  workflow_dispatch:
    inputs:
      test:
        description: env | guest | lease | chain
        required: true
        default: env
        type: string
      mem_mb:
        required: false
        default: '4096'
        type: string
      dirty_mb_s:
        required: false
        default: '40'
        type: string

env:
  GH_OWNER: ${{ github.repository_owner }}
  PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
  SHIM_PAT: ${{ secrets.SHIM_PAT }}
  SPIKE_ID: ${{ github.run_id }}

jobs:
  single:
    if: inputs.test == 'env' || inputs.test == 'guest' || inputs.test == 'lease' || inputs.test == 'chain'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Prepare
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils
          sudo pip3 install -q --break-system-packages 'websockets==13.1' || sudo pip3 install -q --break-system-packages 'websockets==13.1'
          sudo chmod 666 /dev/kvm || true
          git clone -q --depth 1 "https://x-access-token:${SHIM_PAT}@github.com/${GH_OWNER}/${PRIVATE_REPO_NAME}.git" /home/runner/shim-src
      - name: Run
        run: |
          if [ "${{ inputs.test }}" = lease ]; then python3 /home/runner/shim-src/vps-shim/host/lease.py selftest; else python3 /home/runner/shim-src/vps-shim/host/spike.py ${{ inputs.test }} --mem ${{ inputs.mem_mb }}; fi
