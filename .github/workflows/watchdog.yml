name: Fleet Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

env:
  GH_OWNER: ${{ github.repository_owner }}
  PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
  RUNNER_REPO_NAME: ${{ github.event.repository.name }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  SHIM_PAT: ${{ secrets.SHIM_PAT }}

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: fleet-watchdog
      cancel-in-progress: false
    steps:
      - name: Check lease and recover
        run: |
          git clone -q --depth 1 "https://x-access-token:${SHIM_PAT}@github.com/${GH_OWNER}/${PRIVATE_REPO_NAME}.git" /home/runner/shim-src
          python3 /home/runner/shim-src/vps-shim/host/watchdog.py
